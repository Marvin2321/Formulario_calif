<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema de Calificaciones</title>

    <link rel="stylesheet" href="estilos.css">
</head>

<body>

    <div class="contenedor">

        <h1>Sistema de Calificaciones</h1>

        <p>Captura las calificaciones del alumno</p>

        <div class="formulario">
            <!--  es el formulario que sirve para recabar la información del alumno para poder calcular su promedio 
            y guardarlo en la tabla-->
            <label for="nombre">Nombre del alumno:</label>
            <input type="text" id="nombre" placeholder="Escribe el nombre">
            
            <label for="edad">Edad del alumno:</label>
            <input type="text" id="edad" placeholder="Escribe la edad">

            <label for="calificacion1">Calificación 1:</label>
            <input type="number" id="calificacion1" min="0" max="10">

            <label for="calificacion2">Calificación 2:</label>
            <input type="number" id="calificacion2" min="0" max="10">

            <label for="calificacion3">Calificación 3:</label>
            <input type="number" id="calificacion3" min="0" max="10">
            
            <label for="calificacion4">Calificación 4:</label>
            <input type="number" id="calificacion4" min="0" max="10">
            <!-- al hacer click al botón Calcular promedio manda a llamar al método calcularPromedio() de js -->
            <button onclick="calcularPromedio()">
                Calcular promedio
            </button>
            <!-- al hacer click al botón llamado Limpiar manda a llamar a la función limpia() de js -->
            <button onclick="limpia()">
                Limpiar
            </button>
            <!-- al hacer click al botón de agregar alumno manda a llamar a la función agregarAlumno() de js-->
            <button onclick="agregarAlumno()">
                Agregar Alumno
            </button>
            <!--  este contenedor tiene los elementos de la tabla donde se almacenan los alumnos-->
            <div id="listaAlumnos">
                <h3>Alumnos Registrados</h3>
                <table border="1" id="tablaAlumnos">
                    
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Edad</th>
                            <th>Promedio</th>
                        </tr>
                    </thead>
                    <tbody>
                        
                    </tbody>
                </table>
            </div>
        </div>

        <div id="resultado" class="resultado">

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
